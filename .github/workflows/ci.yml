name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install uv==0.13.10
      - name: Install exactly what is locked
        run: uv sync --locked --all-extras
      - name: Lint
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Types
        run: uv run --frozen pyright
      - name: Test, including the released model
        run: uv run --frozen pytest --cov=delivery_eta --cov-fail-under=90
      - name: Retrain, and check against the quality gate
        run: uv run --frozen python -m delivery_eta train --model /tmp/model

  # The way Vercel runs it: its default Python, only what the service needs, from app.py.
  vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install uv==0.13.10
      - run: uv sync --frozen --no-dev --no-editable
      - name: Start it and try it
        run: |
          .venv/bin/python -m uvicorn app:app --port 8090 &
          python3 scripts/smoke_test.py http://localhost:8090 --wait 60

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t delivery-eta .
      - name: Run it the way a host would
        run: |
          docker run -d --name eta --read-only --cap-drop ALL -p 8080:8080 \
            -e PORT=8080 -e ETA_API_KEYS=ci-only-not-a-real-key delivery-eta
          python3 scripts/smoke_test.py http://localhost:8080 --key ci-only-not-a-real-key --wait 60
          test "$(docker exec eta id -u)" = 10001
      - name: Logs
        if: always()
        run: docker logs eta
