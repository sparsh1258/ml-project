[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delivery-eta"
version = "1.0.0"
description = "Predicts food delivery time in minutes, with a likely range."
readme = "README.md"
requires-python = ">=3.12"
# What the running service needs. Training libraries are kept out of it.
dependencies = [
    "fastapi>=0.115",
    "lightgbm>=4.5,<5",
    "numpy>=2",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.6",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
train = ["pandas>=2.2"]
experiments = ["optuna>=4", "pandas>=2.2", "scikit-learn>=1.5", "xgboost>=2.1"]
notebook = ["ipykernel>=6", "matplotlib>=3.9", "nbconvert>=7", "pandas>=2.2"]

[project.scripts]
delivery-eta = "delivery_eta.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pandas-stubs>=2.2", "pyright>=1.1.390", "pytest>=8", "pytest-cov>=6", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_eta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
